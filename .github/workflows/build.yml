name: Build iOS .ipa (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show env
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen (pinned)
        run: |
          brew update
          brew install xcodegen@2.35
          brew link --overwrite xcodegen@2.35

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned, Release)
        run: |
          xcodebuild \
            -project BLEBeaconApp.xcodeproj \
            -scheme BLEBeaconApp \
            -configuration Release \
            -sdk iphoneos \
            SWIFT_VERSION=5.10 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Verify Info.plist contains Bluetooth keys (Release)
        run: |
          APP_PATH=$(xcodebuild -project BLEBeaconApp.xcodeproj -scheme BLEBeaconApp -configuration Release -showBuildSettings | awk '/TARGET_BUILD_DIR/ {dir=$3} /WRAPPER_NAME/ {name=$3} END {print dir "/" name}')
          echo "Checking: $APP_PATH/Info.plist"
          plutil -p "$APP_PATH/Info.plist" | grep NSBluetoothAlwaysUsageDescription \
            || (echo "❌ Missing NSBluetoothAlwaysUsageDescription in FINAL app" && exit 1)
          plutil -p "$APP_PATH/Info.plist" | grep NSBluetoothPeripheralUsageDescription \
            || (echo "❌ Missing NSBluetoothPeripheralUsageDescription in FINAL app" && exit 1)
          echo "✅ Bluetooth privacy keys exist"

      - name: Create IPA (Release)
        run: |
          APP_PATH=$(xcodebuild -project BLEBeaconApp.xcodeproj -scheme BLEBeaconApp -configuration Release -showBuildSettings | awk '/TARGET_BUILD_DIR/ {dir=$3} /WRAPPER_NAME/ {name=$3} END {print dir "/" name}')
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry BLEBeaconApp.ipa Payload
          rm -rf Payload
          ls -lah BLEBeaconApp.ipa
          echo "✅ IPA built: BLEBeaconApp.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: BLEBeaconApp.ipa
