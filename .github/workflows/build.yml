name: Build iOS .ipa (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          brew install ios-deploy

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode & Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project BLEBeaconApp.xcodeproj \
            -scheme BLEBeaconApp \
            -configuration Release \
            -sdk iphoneos \
            SWIFT_VERSION=5.10 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Verify Info.plist contains Bluetooth keys
        run: |
          APP_PATH=$(xcodebuild -project BLEBeaconApp.xcodeproj -scheme BLEBeaconApp -showBuildSettings | awk '/TARGET_BUILD_DIR/ {dir=$3} /FULL_PRODUCT_NAME/ {name=$3} END {print dir "/" name}')
          echo "Checking Info.plist: $APP_PATH/Info.plist"
          plutil -p "$APP_PATH/Info.plist" | grep NSBluetoothAlwaysUsageDescription \
            || (echo "❌ MISSING BLUETOOTH USAGE KEY IN FINAL APP" && exit 1)
          echo "✅ Bluetooth privacy key exists"

      - name: Create IPA
        run: |
          APP_PATH=$(xcodebuild -project BLEBeaconApp.xcodeproj -scheme BLEBeaconApp -showBuildSettings | awk '/TARGET_BUILD_DIR/ {dir=$3} /FULL_PRODUCT_NAME/ {name=$3} END {print dir "/" name}')
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry BLEBeaconApp.ipa Payload
          rm -rf Payload
          echo "✅ IPA built: BLEBeaconApp.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: BLEBeaconApp.ipa
