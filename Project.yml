name: BLEBeaconApp

options:
  minimumXcodeGenVersion: 2.35.0

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: pl.yourcompany.blebeaconapp
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    SWIFT_VERSION: 5.10 
    
targets:
  BLEBeaconApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
    entitlements:
      path: Entitlements.plist
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreLocation.framework
      - sdk: UserNotifications.framework
    scheme:
      testTargets: []
